t;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;3 \u00b7 Panel title&quot;}, &quot;title4Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Sandy soil&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;4 \u00b7 Panel title&quot;}, &quot;title5Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Predict&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;5 \u00b7 Panel title&quot;}, &quot;title6Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Clayey soil&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;6 \u00b7 Panel title&quot;}, &quot;title7Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Loamy soil&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;7 \u00b7 Panel title&quot;}, &quot;title8Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Feel test&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;8 \u00b7 Panel title&quot;}, &quot;title9Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;WOW! Cocopeat&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;9 \u00b7 Panel title&quot;}, &quot;title10Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Recap&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;10 \u00b7 Panel title&quot;}, &quot;title11Text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Quick check&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;11 \u00b7 Panel title&quot;}}">

  renderVals() {
    const p = this.props;
    // Generic tweak forwarding — defaults mirror TITLES in scenes.jsx (keep in sync).
    const defs = {
      showCaptions: true, captionSize: 34, renderScale: 2, collageOpacity: 0.07, showLogo: true, logoScale: 1,

    for (const k in defs) tweaks[k] = p[k] ?? defs[k];
    return { tweaks };

<script>window.TP_AUTOPLAY = false;</script>
<style>#tp-start{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(5,30,22,.55);cursor:pointer}
#tp-start button{font:700 34px Caladea,Cambria,Georgia,serif;color:#163A2C;background:#E2B04C;border:0;border-radius:999px;padding:22px 54px;box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer}
#tp-start small{display:block;font:20px Carlito,Calibri,sans-serif;color:#F6F1E3;margin-top:14px;text-align:center}</style>
<div id="tp-start"><div><button type="button">▶ Play</button><small>with voice-over and music</small></div></div>
<script>(function(){
  var o = document.getElementById('tp-start'), done = false;
  var ready = function(){ return !!document.querySelector('svg[data-om-sync-seek]'); };
  function start(){ if (done) return; done = true; o.remove();
    var tries = 0, go = function(){ if (!ready()) return setTimeout(go, 150);
      if (window.TP_NOW && window.TP_NOW.playing) return;          // keep nudging until the timeline really runs
      if (tries++ > 12) return;
      window.dispatchEvent(new KeyboardEvent('keydown', {code: 'Space', bubbles: true}));
      setTimeout(go, 400); };
    go(); }
  o.addEventListener('click', start);
  window.addEventListener('keydown', function(e){ if (e.code === 'Space' && !done) { done = true; o.remove(); } }, true);
  try { var probe = new Audio(window.TP_AUDIO || ''); probe.volume = 0.01;
    probe.play().then(function(){ probe.pause(); start(); }).catch(function(){}); } catch (e) {}
  setTimeout(function(){ document.title = 'LP21 – Soil Texture · V1'; }, 4000);
})();</script>
